<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Security</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- MQTT Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>
        <i class="fas fa-shield-alt"></i> Smart Home Security
    </h1>

    <div class="card">
        <h3><i class="fas fa-wifi"></i> Koneksi ESP32</h3>
        <p id="connection"><i class="fas fa-circle"></i> 🔴 Tidak Terhubung</p>

        <h3><i class="fas fa-door-open"></i> Status Pintu</h3>
        <p id="doorStatus"><i class="fas fa-lock"></i> 🔒 TERKUNCI</p>

        <h3><i class="fas fa-key"></i> Status Password</h3>
        <p id="passwordStatus"><i class="fas fa-minus-circle"></i> -</p>

        <input 
            id="password" 
            type="password" 
            placeholder="Masukkan password" 
            autocomplete="current-password"
        >

        <div class="button-group">
            <button class="btn-unlock" onclick="sendPassword()">
                <i class="fas fa-unlock-alt"></i> BUKA PINTU
            </button>
            <button class="btn-lock" onclick="closeDoor()">
                <i class="fas fa-lock"></i> TUTUP PINTU
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>

</html>
